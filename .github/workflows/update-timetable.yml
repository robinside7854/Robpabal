name: 시간표 자동 업데이트

# 매주 월요일 새벽 4시(한국시간)에 서울 공공데이터에서 최신 시간표를 받아옵니다.
# 저장소 Actions 탭에서 "Run workflow" 버튼으로 직접 돌릴 수도 있습니다.
on:
  schedule:
    - cron: '0 19 * * 0' # UTC 일요일 19:00 = 한국 월요일 04:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 인증키 확인
        env:
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
        run: |
          if [ -z "$SEOUL_OPENAPI_KEY" ]; then
            echo "::error::SEOUL_OPENAPI_KEY 시크릿이 없습니다. README의 '자동 업데이트 켜기'를 참고해 등록해주세요."
            exit 1
          fi

      - name: 최신 시간표 받아오기
        env:
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
        run: node scripts/update-timetable.mjs

      - name: 바뀐 내용 커밋
        run: |
          if git diff --quiet -- data/line3-gupabal.json; then
            echo "바뀐 시간표가 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/line3-gupabal.json
          git commit -m "chore: 구파발역 3호선 시간표 자동 업데이트 ($(date -u +%Y-%m-%d))"
          git push
